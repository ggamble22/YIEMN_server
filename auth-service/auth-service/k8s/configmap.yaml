apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service
data:
  STORAGE_BACKEND: dynamodb
  DYNAMODB_TABLE: auth
  AWS_REGION: us-east-1
  JWT_ISSUER: yiemn-auth
  ACCESS_TOKEN_TTL_SECS: "900"
  REFRESH_TOKEN_TTL_SECS: "2592000"
  RATE_LIMIT_PER_MINUTE: "30"
  # The ingress controller is the single trusted hop that appends the client IP.
  TRUST_FORWARDED_FOR: "true"
  CORS_ALLOWED_ORIGINS: https://app.example.com # CHANGE ME
  REQUEST_TIMEOUT_SECS: "10"
  LOG_FORMAT: json
  RUST_LOG: info
