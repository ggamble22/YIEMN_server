# Local development: DynamoDB Local + table bootstrap + the service.
#   docker compose up --build
#   curl -k https://localhost/readyz     (PowerShell: curl.exe -k ...)
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]

  create-table:
    image: amazon/aws-cli:latest
    depends_on: [dynamodb]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_TABLE: auth
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    volumes: ["./scripts:/scripts:ro"]
    # Strip Windows line endings (CRLF) first, so this works however the
    # script was checked out or edited on Windows.
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /scripts/create-table.sh | /bin/sh"]

  auth-service:
    build:
      context: .
      args:
        # Which branch/tag/commit of the GitHub repo to build. Override with
        #   GIT_REF=my-branch docker compose up --build   (bash)
        #   $env:GIT_REF="my-branch"; docker compose up --build   (PowerShell)
        GIT_REF: ${GIT_REF:-main}
    depends_on:
      create-table:
        condition: service_completed_successfully
    # HTTPS on the standard port: https://localhost  ->  container port 8443.
    # If 443 is already taken on your machine, use e.g. "8443:8443" instead.
    ports: ["443:8443", "9090:9090"]
    environment:
      STORAGE_BACKEND: dynamodb
      DYNAMODB_TABLE: auth
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      JWT_SECRET: local-dev-secret-change-me-at-least-32-bytes
      JWT_ISSUER: yiemn-auth
      LOG_FORMAT: pretty
      RUST_LOG: info,auth_service=debug
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Local HTTPS with a certificate generated at startup (browsers will warn).
      TLS_SELF_SIGNED: "true"
      # Local only: photos kept in memory, no AWS moderation.
      PHOTO_STORAGE: memory
      PHOTO_MODERATION: "off"
