apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels: { app: auth-service }
spec:
  # The HPA owns the replica count; this is just the initial value.
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: true # needed for IRSA token projection
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # Spread across zones and nodes so a zone outage takes out at most a third.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: auth-service } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: auth-service } }
      containers:
        - name: auth-service
          image: auth-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: auth-service }
            - secretRef: { name: auth-service }
          env:
            # Size the Argon2 concurrency cap to the CPU limit below (2 cores × 2).
            - { name: MAX_CONCURRENT_HASHES, value: "4" }
            # Each photo decode can use up to ~100 MiB; 2 at once fits the memory limit.
            - { name: MAX_CONCURRENT_PHOTO_JOBS, value: "2" }
          resources:
            # Argon2 is CPU-bound: the HPA scales on CPU, so requests must be realistic.
            requests: { cpu: 500m, memory: 128Mi }
            # Memory covers Argon2 (~19 MiB × 4) plus two photo decodes (~100 MiB each).
            limits: { cpu: "2", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          lifecycle:
            # Give the load balancer time to stop sending traffic before SIGTERM.
            # (Native sleep action: Kubernetes >= 1.30. Distroless has no `sleep` binary.)
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
