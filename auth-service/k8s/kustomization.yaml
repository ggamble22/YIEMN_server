# kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml
  # The Secret is NOT committed. Create it out-of-band (see secret.example.yaml),
  # ideally via External Secrets Operator / Sealed Secrets backed by AWS Secrets Manager.
images:
  - name: auth-service
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/auth-service # CHANGE ME
    newTag: "0.1.0"
