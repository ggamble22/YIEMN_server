# Pods get DynamoDB access through IAM Roles for Service Accounts (IRSA) —
# no static AWS keys anywhere. The role/policy is defined in infra/terraform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/auth-service # CHANGE ME
